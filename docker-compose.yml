version: '3.8'

volumes:
  postgres_data:
  redis_data:
  prometheus:
  grafana:

services:
  postgres:
    container_name: mood_diary_db
    image: postgres:11.13-alpine
    command:
      - "postgres"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "effective_cache_size=4GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "temp_file_limit=10GB"
      - "-c"
      - "log_min_duration_statement=200ms"
      - "-c"
      - "idle_in_transaction_session_timeout=10s"
      - "-c"
      - "lock_timeout=1s"
      - "-c"
      - "statement_timeout=60s"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.max=10000"
      - "-c"
      - "pg_stat_statements.track=all"
    environment:
      POSTGRES_DB: ${PG__NAME:-mood_diary}
      POSTGRES_USER: ${PG__USER:-user}
      POSTGRES_PASSWORD: ${PG__PASSWORD:-pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG__USER:-user} -d ${PG__NAME:-mood_diary}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 2s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 4G
    networks:
      - mood-diary-network

  redis:
    container_name: mood-diary-redis
    image: "redis:7-alpine"
    command: redis-server --requirepass ${REDIS__PASSWORD:-password}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS__PORT:-6379}:6379"
    environment:
      - REDIS_PASSWORD=${REDIS__PASSWORD:-password}
    networks:
      - mood-diary-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS__PASSWORD:-password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: mood-diary-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${PG__USER:-user}:${PG__PASSWORD:-pass}@postgres:5432/${PG__NAME:-mood_diary}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mood-diary-network
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: mood-diary-redis-exporter
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: "${REDIS__PASSWORD:-password}"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - mood-diary-network
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: mood-diary-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - mood-diary-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: mood-diary-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - mood-diary-network

  grafana:
    image: grafana/grafana:latest
    container_name: mood-diary-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-piechart-panel
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/mood-diary.json
      - GF_USERS_DEFAULT_THEME=dark
    volumes:
      - grafana:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - mood-diary-network

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    tty: true
    networks:
      - mood-diary-network

  bot:
    container_name: bot
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mood-diary-network

networks:
  mood-diary-network:
    driver: bridge