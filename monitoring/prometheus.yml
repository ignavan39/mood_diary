global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml" 

scrape_configs:
  - job_name: 'mood-diary-bot'
    static_configs:
      - targets: ['bot:8000']
    metrics_path: '/metrics'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']